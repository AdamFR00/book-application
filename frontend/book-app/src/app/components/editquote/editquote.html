<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 800px">
    <div class="card-body p-4">
      <h2 class="card-title mb-4">Edit Quote</h2>

      <form [formGroup]="quoteForm" (ngSubmit)="updateQuote(quoteId)">
        <div>
          <label for="content" class="form-label">Quote</label>
          <textarea
            id="content"
            type="text"
            class="form-control quote-input"
            formControlName="Content"
            rows="4"
          >
          </textarea>
        </div>
        <button
          type="submit"
          class="btn btn-primary my-2"
          [disabled]="quoteForm.invalid"
        >
          Save Changes
        </button>
      </form>
    </div>
  </div>
</div>
