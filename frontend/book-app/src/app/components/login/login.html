<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4 text-center">
            <img class="mb-3" src="/images/logo.png" height="200" alt="Logo">
            <h1 class="text-light">Sign in</h1>
            <form class = "needs-validation" [formGroup] ="loginForm" (ngSubmit)="onLogin()">
                <div class="mb-3">
                    <label for="userName" class="form-label text-light">Username</label>
                    <input type="text" id="userName" class="form-control" formControlName = "UserName" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label for="Password" class="form-label text-light">Password</label>
                    <input type="password" class="form-control" formControlName ="Password" id="Password" placeholder="Enter password" required>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-lg btn-primary btn-block" [disabled] ="loginForm.invalid">Log in</button>
                </div>
                
            </form>
            <p class="mt-3 text-light">
                Don't have an account?
                <a [routerLink]= "['/register']" class="cursor-pointer link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover">Register here</a>
            </p>
        </div>

    </div>
</div>
