@if(registrationSuccessfull()){
    <div class="container mt-5 text-center">
        <p class="text-success fs-5 fw-semibold">Account created successfully!</p>
        <p class="text-light">Redirecting to login page...</p>
    </div>
}@else {
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4 text-center">
                <h1 class="text-light">Register</h1>
                <form class = "needs-validation" [formGroup] ="registerForm" (ngSubmit)="onRegister()" novalidate>
                    <div class="mb-3">
                        <label for="userName" class="form-label text-light">Username</label>
                        <input type="text" id="userName" class="form-control" formControlName = "UserName" placeholder="Enter username" [class.is-invalid] = "usernameError() != null" required>
                        @if(usernameError()){
                            <div class="invalid-feedback">
                                {{usernameError()}}
                            </div>
                        }
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label text-light">Password</label>
                        <input type="password" class="form-control" formControlName ="Password" id="exampleInputPassword1" placeholder="Enter password" required>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-lg btn-primary btn-block" [disabled] ="registerForm.invalid">Register</button>
                    </div>
                    
                </form>
            </div>
    
        </div>
    </div>
}
