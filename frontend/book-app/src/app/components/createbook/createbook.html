<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 800px">
    <div class="card-body p-4">
      <button class="btn btn-primary" routerLink="/home/books">
        <fa-icon [icon]="faArrowLeft"></fa-icon>
      </button>

      <h2 class="card-title mb-4 text-center">Add Book</h2>

      <form [formGroup]="bookForm" (ngSubmit)="createBook()">
        <div class="mb-3">
          <label for="title" class="form-label fw-bold">Title</label>
          <input
            id="title"
            type="text"
            class="form-control"
            formControlName="Title"
          />
        </div>

        <div class="mb-3">
          <label for="author" class="form-label fw-bold">Author</label>
          <input
            id="author"
            type="text"
            class="form-control"
            formControlName="Author"
          />
        </div>

        <div class="mb-4">
          <label for="releaseYear" class="form-label fw-bold">
            Release Year
          </label>
          <input
            id="releaseYear"
            type="number"
            class="form-control"
            formControlName="YearPublished"
          />
        </div>
        <div class="d-flex gap-2 align-items-center">
          <button
          type="submit"
          class="btn btn-primary"
          [disabled]="bookForm.invalid"
        >
          Add Book
        </button>
        @if(bookCreationError()){
          <span class="text-danger fw-semibold">{{bookCreationError()}}</span>
        }
      </div>
      </form>
    </div>
  </div>
</div>
